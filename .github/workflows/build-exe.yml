name: Build Windows exe

# Builds the published dist\PlayLimit.exe on a real Windows runner (PyInstaller does
# NOT cross-compile, and the native C# launcher needs csc.exe which only exists on
# Windows). This runs the SAME build.ps1 the maintainer uses locally, so CI and local
# builds are identical: a PyInstaller onefile "real app" wrapped in a native launcher
# that strips PyInstaller's private _PYI_* env (fixing the onefile parent-process
# security validation / "Failed to load Python DLL" update brick).
#
# The maintainer then commits dist/PlayLimit.exe + dist/PlayLimit.exe.sha256 (GPG-signed)
# and only AFTER that bumps version.txt — see AGENTS.md "Release gate".

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
    paths:
      - "albion_limiter.py"
      - "version.txt"
      - "version_info.txt"
      - "playlimit.ico"
      - "splash.png"
      - "monitor/dashboard.html"
      - "bootstrap/**"
      - "build.ps1"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # Pin PyInstaller to 6.22.0 — the newest release BEFORE the onefile
        # parent-process security validation added in 6.22.1 (#9492). The native
        # launcher already neutralises the _PYI_* leak, but PlayLimit also runs
        # elevated via Task Scheduler (RunLevel Highest), and 6.22.3's check fires
        # on elevated launches. 6.22.0 has no such check. Do NOT bump past 6.22.0
        # without re-testing an elevated launch on a real Windows box.
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.22.0" pystray pillow psutil

      - name: Show version being built
        shell: pwsh
        run: |
          Write-Host "version.txt      = $(Get-Content version.txt)"
          Write-Host "__version__ line = $(Select-String -Path albion_limiter.py -Pattern '^__version__' | Select-Object -First 1)"

      - name: Build native-launcher PlayLimit.exe (build.ps1)
        shell: pwsh
        # PLAYLIMIT_PYTHON=python so build.ps1 uses the setup-python 3.12 where
        # PyInstaller was installed (the `py` launcher may resolve elsewhere).
        env:
          PLAYLIMIT_PYTHON: python
        run: .\build.ps1

      - name: Show build output
        shell: pwsh
        run: |
          Get-Item dist\PlayLimit.exe | Format-List Name, Length, VersionInfo
          Write-Host "sha256 file:"; Get-Content dist\PlayLimit.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayLimit-exe
          path: |
            dist/PlayLimit.exe
            dist/PlayLimit.exe.sha256
          if-no-files-found: error
          retention-days: 14

name: Build Windows exe

# Builds PlayLimit.exe on a real Windows runner (PyInstaller does NOT cross-compile),
# generates the matching .sha256, and uploads both as a downloadable artifact.
# The maintainer then commits dist/PlayLimit.exe + dist/PlayLimit.exe.sha256 to the
# branch themselves (GPG-signed) — see AGENTS.md "Release gate".

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
    paths:
      - "albion_limiter.py"
      - "version.txt"
      - "version_info.txt"
      - "playlimit.ico"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # Pin PyInstaller to 6.22.0 — the newest release BEFORE the onefile
        # parent-process security validation added in 6.22.1 (#9492). That check
        # aborts elevated onefile launches (PlayLimit runs via Task Scheduler at
        # RunLevel Highest, re-spawned by the self-hop updater) with
        # "security validation failure: failed to obtain executable path for
        # parent process". 6.22.0 has no such check. Do NOT bump past 6.22.0
        # without re-testing an elevated launch on a real Windows box.
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.22.0" pystray pillow psutil

      - name: Show version being built
        shell: pwsh
        run: |
          Write-Host "version.txt      = $(Get-Content version.txt)"
          Write-Host "__version__ line = $(Select-String -Path albion_limiter.py -Pattern '^__version__' | Select-Object -First 1)"

      - name: Build PlayLimit.exe
        # Use `python` (the setup-python 3.12 on PATH where PyInstaller was installed),
        # NOT `py` — the py launcher may resolve to a different Python on the runner.
        run: >
          python -m PyInstaller --onefile --noconsole --name PlayLimit
          --icon playlimit.ico --version-file version_info.txt
          --distpath dist --workpath build --specpath .
          --hidden-import pystray --hidden-import PIL --hidden-import psutil
          albion_limiter.py

      - name: Generate SHA256
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist\PlayLimit.exe -Algorithm SHA256).Hash
          "$sha  PlayLimit.exe" | Set-Content dist\PlayLimit.exe.sha256 -NoNewline
          Write-Host "SHA256 = $sha"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayLimit-exe
          path: |
            dist/PlayLimit.exe
            dist/PlayLimit.exe.sha256
          if-no-files-found: error
          retention-days: 14
